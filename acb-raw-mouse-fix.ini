; Assassin's Creed Brotherhood Raw Input Mouse Fix
; Keep this file beside ACBRawMouseFix.asi. Edit it while the game is closed.

[Mouse]
; 1 = the cameras turn by raw mouse counts: no acceleration, and the same turn per count
; at every frame rate. F8 in game switches back to the stock camera to compare.
LinearCamera=1
; Sensitivity, on top of the game's own sliders. Every mouse camera (third and first
; person) turns by these. 1.0 = stock at 60 FPS for slow, precise movement.
; F9/F10 in game lower/raise Sensitivity by 5 % and save it here.
Sensitivity=1.0
; Horizontal and vertical multipliers, on top of Sensitivity.
SensitivityX=1.0
SensitivityY=1.0
; Base calibration of the third-person camera (stick units per count). Leave it at 25 and
; use Sensitivity instead.
MouseScale=25
; 1 = counts from Raw Input (WM_INPUT). 0 = from the game's DirectInput polls.
UseRawInput=1
; 1 = cameras that use the game's own counts (first person) get all counts of each poll. The
; game drops everything above 150 counts per poll horizontally and 100 vertically.
RemoveClamp=1

[Diagnostics]
; 1 = once a second, write mouse and camera statistics to acb-raw-mouse-fix.log. Useful
; for a bug report; leave it at 0 for normal play.
StatsLog=0
